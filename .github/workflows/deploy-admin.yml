name: Deploy ADMIN to Google Cloud Run
on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'app/admin/**'
      - 'app/api/admin/**'
      - 'components/**'
      - 'lib/**'
      - 'packages/**'
      - 'Dockerfile.northflank-admin'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-cloud-web-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate Google-only configuration
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          TARGET: ${{ vars.GCP_ADMIN_SERVICE }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          set -euo pipefail
          for v in PROJECT REGION PROVIDER ACCOUNT TARGET REPOSITORY; do
            test -n "${!v}" || { echo "::error::Missing Google configuration: $v"; exit 1; }
          done
          test "$PROJECT" = "elegant-racer-299721" || { echo "::error::Unexpected Google project"; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker authentication
        env:
          REGION: ${{ vars.GCP_REGION }}
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Verify build configuration
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY" || { echo "::error::Missing Supabase build configuration"; exit 1; }
      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.northflank-admin
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/tax-admin:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Deploy existing Cloud Run service without modifying runtime configuration
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.GCP_ADMIN_SERVICE }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(metadata.name)' >/dev/null
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/$REPOSITORY/tax-admin:${GITHUB_SHA}"
          gcloud run deploy "$SERVICE" --image "$IMAGE" --project "$PROJECT" --region "$REGION" --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.conditions)'

      - name: Verify deployed revision and traffic
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.GCP_ADMIN_SERVICE }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          set -euo pipefail
          expected="$REGION-docker.pkg.dev/$PROJECT/$REPOSITORY/tax-admin:${GITHUB_SHA}"
          ready="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$ready" || { echo "::error::No ready revision"; exit 1; }
          image="$(gcloud run revisions describe "$ready" --project "$PROJECT" --region "$REGION" --format='value(spec.containers[0].image)')"
          test "$image" = "$expected" || { echo "::error::Ready revision image mismatch"; exit 1; }
          ready_condition="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.conditions[0].status)')"
          test "$ready_condition" = "True" || { echo "::error::Cloud Run service not ready"; exit 1; }
          traffic="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.traffic[0].percent)')"
          test "$traffic" = "100" || { echo "::error::Latest service traffic is not 100%"; exit 1; }
          {
            echo "### Google Cloud Run deployment verified"
            echo "- Service: $SERVICE"
            echo "- Project: $PROJECT"
            echo "- Revision: $ready"
            echo "- Commit: $GITHUB_SHA"
            echo "- Ready image: $image"
            echo "- Traffic: $traffic%"
          } >> "$GITHUB_STEP_SUMMARY"
