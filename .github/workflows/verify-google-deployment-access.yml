name: Verify Google deployment access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-google-deployment-access.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/github-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Discover existing services without changing them
        run: |
          gcloud run services list --project=elegant-racer-299721 --region=us-central1 --format='table(metadata.name,status.url,status.latestReadyRevisionName)'
          gcloud artifacts repositories list --project=elegant-racer-299721 --location=us-central1 --format='table(name,format)'
