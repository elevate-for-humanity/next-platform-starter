name: Validate PARIS tax software source
on:
  push:
    branches: [main]
    paths:
      - 'app/tax/**'
      - 'app/tax-software/**'
      - 'app/api/tax/**'
      - 'lib/tax-software/**'
      - 'scripts/test-tax-*.mjs'
      - '.github/workflows/deploy-lms.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node scripts/test-tax-calculation-failures.mjs
      - run: node scripts/test-tax-w2-validation.mjs
# The production owner is Elevate-lms/apps/marketing. That repository verifies
# this source bundle and releases it through its existing Google Marketing job.
# Do not overwrite the workforce LMS service with this source repository.
