# Cloud Build validation runs in Google's build workers, not Cloud Shell.
# Configure a GitHub-connected Cloud Build trigger pointing to this file.
steps:
  - id: install-and-typecheck
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        corepack enable
        corepack prepare pnpm@10.28.2 --activate
        pnpm install --no-frozen-lockfile
        pnpm run typecheck
    env:
      - CI=true
      - NODE_OPTIONS=--max-old-space-size=8192
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
